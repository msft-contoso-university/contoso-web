openapi: 3.0.3
info:
  title: Contoso Students API
  version: 1.0.0
  description: |
    Student-owned record lookup. Enrollment and course details are composed
    by consumers and are not returned by this service.
paths:
  /api/v1/students:
    get:
      operationId: listStudents
      description: Requires the delegated students.read scope and Reader or Registrar role.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: A page of up to 50 student records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
    post:
      operationId: createStudent
      description: Requires the delegated students.write scope and Registrar role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudent'
      responses:
        '201':
          description: The created student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: First and last name are required.
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
  /api/v1/students/search:
    get:
      operationId: searchStudents
      description: Requires the delegated students.read scope and Reader or Registrar role.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student records matching a first or last name prefix.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '400':
          description: The name parameter is missing.
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
  /api/v1/students/{id}:
    get:
      operationId: getStudent
      description: |
        Delegated access requires the students.read scope and Reader or
        Registrar app role. App-only access requires the Students.Lookup
        app role and an idtyp=app claim.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
        '404':
          description: The student does not exist.
    put:
      operationId: updateStudent
      description: Requires the delegated students.write scope and Registrar role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudent'
      responses:
        '204':
          description: The student was updated.
        '400':
          description: ID mismatch or required names are missing.
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
        '404':
          description: The student does not exist.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StudentPage:
      type: object
      required: [students, count, pages, currentPage]
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        count:
          type: integer
          format: int32
        pages:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
    CreateStudent:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        enrollmentDate:
          type: string
          format: date-time
    UpdateStudent:
      allOf:
        - $ref: '#/components/schemas/CreateStudent'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
    Student:
      type: object
      required: [id, firstName, lastName, enrollmentDate]
      properties:
        id:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        enrollmentDate:
          type: string
          format: date-time
